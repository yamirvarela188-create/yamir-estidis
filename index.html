<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamir Studio</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
        body{background:#0d1117;color:#e6edf3;padding:12px;max-width:480px;margin:0 auto}
        .banner{background:#161b22;border:1px solid #ffd700;color:#ffd700;text-align:center;padding:10px;border-radius:8px;font-weight:700;margin-bottom:12px;font-size:1.1rem}
        .btn-group{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
        .btn{padding:10px;border-radius:6px;font-weight:700;border:none;cursor:pointer;text-align:center;text-decoration:none;font-size:.85rem;transition:transform .1s,opacity .1s}
        .btn:active{transform:scale(.96);opacity:.85}
        .btn-red{background:#da3633;color:#fff}
        .btn-gray{background:#21262d;color:#c9d1d9;border:1px solid #30363d}
        .tabs{display:flex;gap:6px;margin-bottom:12px}
        .tab-btn{flex:1;padding:10px;background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:6px;font-weight:700;cursor:pointer;transition:transform .1s}
        .tab-btn:active{transform:scale(.96)}
        .tab-btn.active{background:#238636;color:#fff;border-color:#2ea043}
        .tab-btn.active-prem{background:#d29922;color:#000;border-color:#ffd700}
        .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;margin-bottom:10px;text-align:center;cursor:pointer;transition:transform .1s}
        .card:not(.blocked):active{transform:scale(.97)}
        .card img{width:100%;height:160px;object-fit:cover;border-radius:6px;margin-bottom:8px;display:block;background:#0d1117}
        .card-title{font-weight:700;font-size:.95rem;margin-bottom:6px;color:#f0f6fc}
        .badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:.7rem;font-weight:700}
        .badge-norm{background:rgba(46,160,67,.2);color:#3fb950;border:1px solid #2ea043}
        .badge-prem{background:rgba(212,167,44,.2);color:#f2cc60;border:1px solid #d29922}
        .badge-red{background:rgba(248,81,73,.2);color:#f85149;border:1px solid #f85149;margin-top:6px;display:block;padding:4px;border-radius:4px;font-size:.75rem}
        .badge-yellow{background:rgba(210,153,34,.2);color:#d29922;border:1px solid #d29922;margin-top:6px;display:block;padding:4px;border-radius:4px;font-size:.75rem}
        .blocked{opacity:.6;cursor:not-allowed}
        .step-box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:10px;position:relative}
        .step-btn{background:#0d1117;border:1px solid #30363d;color:#fff;padding:12px;border-radius:6px;font-weight:700;cursor:pointer;width:100%;margin-bottom:6px;transition:transform .1s}
        .step-btn:active{transform:scale(.97)}
        .step-btn.done{border-color:#2ea043;color:#3fb950;background:rgba(46,160,67,.1)}
        code{background:#0d1117;border:1px dashed #2ea043;color:#3fb950;padding:12px;border-radius:6px;font-size:.75rem;word-break:break-all;white-space:pre-wrap;display:block}
        
        /* REPRODUCTOR FLOTANTE DE VIDEO */
        .video-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}
        .video-container{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;width:100%;max-width:340px;position:relative;text-align:center}
        .close-video-btn{position:absolute;top:8px;right:8px;background:#da3633;color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-weight:700;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .close-video-btn:active{transform:scale(.9)}
        .video-wrapper{position:relative;width:100%;padding-top:177.77%;border-radius:8px;overflow:hidden;background:#000;margin-top:10px}
        .video-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

        .tag-owner{position:absolute;top:10px;left:10px;font-size:.65rem;font-weight:700;opacity:.7}
        .tag-yamir{color:#3fb950}
        .tag-steven{color:#f85149}
        .hidden{display:none!important}
    </style>
</head>
<body>

    <div id="maint-screen" class="hidden" style="text-align:center;padding:40px 10px;">
        <h2 style="color:#f85149">MANTENIMIENTO GENERAL</h2>
        <p style="color:#8b949e;margin-top:10px">La página se encuentra en mantenimiento.</p>
    </div>

    <!-- PÁGINA PRINCIPAL DE SCRIPTS -->
    <div id="app-screen">
        <div class="banner">YAMIR STUDIO</div>

        <div class="btn-group">
            <button class="btn btn-red" onclick="openVideoModal()">🎥 ¿CÓMO USAR?</button>
            <a href="https://yamirvarela188-create.github.io/Reporte-/" target="_blank" class="btn btn-gray">🚩 REPORTAR ERROR</a>
        </div>

        <div class="tabs">
            <button id="tb-free" class="tab-btn active" onclick="switchTab('free')">NORMAL</button>
            <button id="tb-prem" class="tab-btn" onclick="switchTab('prem')">PREMIUM ⭐</button>
        </div>

        <div id="list-free"></div>
        <div id="list-prem" class="hidden"></div>
    </div>

    <!-- VISTA DE PASOS -->
    <div id="step-screen" class="hidden">
        <div class="banner">YAMIR STUDIO</div>
        <button class="btn btn-gray" style="width:100%" onclick="closeStepView()">← Volver a la lista</button>
        <div class="step-box">
            <span id="owner-tag" class="tag-owner"></span>
            <h3 id="st-title" style="text-align:center;color:#f0f6fc;margin-top:8px">Cargando...</h3>
            <div id="st-phase" style="text-align:center;color:#3fb950;font-weight:700">FASE 1</div>
            <div id="st-g1"></div>
            <div id="st-g2" class="hidden"></div>
            <div id="st-final" class="hidden">
                <code id="script-code"></code>
                <button class="btn btn-red" style="width:100%;margin-top:10px;background:#238636" onclick="copyScript()">COPIAR SCRIPT</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE REPRODUCTOR DE VIDEO CON BOTÓN X -->
    <div id="video-modal" class="video-modal hidden">
        <div class="video-container">
            <button class="close-video-btn" onclick="closeVideoModal()">✕</button>
            <h3 style="color:#ffd700;font-size:0.95rem;margin-top:4px;">¿Cómo usar Yamir Studio?</h3>
            <div class="video-wrapper">
                <iframe id="youtube-iframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID="1Ijxd38344GIdnPBK1693SLE7KmOxy59CTorchrxe5og";
        const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&cachebuster=`+Date.now();
        
        // ENLACES CON DISTRIBUCIÓN PONDERADA (YAMIR 90% / STEVEN 30%)
        const AD_YAMIR = "https://uplcm.com/4/11169505";
        const AD_STEVEN = "https://uplcm.com/4/10022394";

        const store={};
        let activeScript="",clicks=0,targetClicks=0,waitSecs=6;
        let lastBtn=null,clickTime=0,isPhase2=false;
        let currentAdUrl = "";

        const urlParams=new URLSearchParams(window.location.search);
        const scriptParam=urlParams.get('s');

        function clean(v){return v?v.trim().replace(/^"|"$/g,'').replace(/""/g,'"'):""}

        function processImgUrl(url){
            if(!url)return"";
            url=url.trim();
            if(url.includes("drive.google.com")){
                const m=url.match(/\/d\/([a-zA-Z0-9_-]+)/)||url.match(/id=([a-zA-Z0-9_-]+)/);
                if(m&&m[1])return`https://drive.google.com/uc?export=view&id=${m[1]}`;
            }
            return url;
        }

        async function init(){
            try{
                const res=await fetch(CSV_URL);
                const text=await res.text();
                const rows=text.split("\n");
                
                const globalAlerts=rows.slice(1).map(r=>clean(r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)[6]||"").toLowerCase());
                if(globalAlerts.some(a=>a.includes("mantenimiento página")||a.includes("mantenimiento pagina"))){
                    document.getElementById("app-screen").classList.add("hidden");
                    document.getElementById("step-screen").classList.add("hidden");
                    document.getElementById("maint-screen").classList.remove("hidden");
                    return;
                }

                let freeItems = [];
                let premItems = [];

                let idCounter=0;
                rows.slice(1).forEach((row, index)=>{
                    const cols=row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(cols.length<3)return;

                    let name=clean(cols[0]),rawImg=clean(cols[1]),imgUrl=processImgUrl(rawImg);
                    let code=clean(cols[2]),ver=clean(cols[3]||""),ordenCmd=clean(cols[4]||"").toLowerCase();
                    let ads=clean(cols[5]||""),aviso=clean(cols[6]||"");
                    if(!name||!code)return;

                    const id="s"+(++idCounter);
                    const isPrem=ver.toLowerCase().includes("premium");
                    let reqClicks=parseInt(ads)||(isPrem?7:5);

                    store[id]={id,name,code,reqClicks,waitSecs:isPrem?8:6,hasAds:ads.toLowerCase()!=="no"};

                    let alertHtml="",isBlocked=false,nLow=name.toLowerCase();

                    if(aviso.toLowerCase().includes("mantenimiento")||globalAlerts.some(g=>g.includes("mantenimiento")&&g.includes(nLow))){
                        alertHtml='<span class="badge badge-yellow">EN MANTENIMIENTO</span>';
                        isBlocked=true;
                    }else if(aviso.toLowerCase().includes("parcheado")||aviso.toLowerCase().includes("no funciona")||globalAlerts.some(g=>(g.includes("parcheado")||g.includes("no funciona"))&&g.includes(nLow))){
                        alertHtml='<span class="badge badge-red">PARCHEADO / NO FUNCIONA</span>';
                        isBlocked=true;
                    }

                    const card=document.createElement("div");
                    card.className="card "+(isBlocked?"blocked":"");
                    card.onclick=()=>!isBlocked&&openStepView(id);

                    const imgTag=imgUrl?`<img src="${imgUrl}" alt="${name}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:'';
                    const titleTag=`<div class="card-title">${name}</div>`;
                    const badgeType=`<span class="badge ${isPrem?'badge-prem':'badge-norm'}">${isPrem?'PREMIUM':'NORMAL'}</span>`;

                    // COMANDOS DE POSICIÓN DE LA IMAGEN DENTRO DE LA TARJETA
                    if(ordenCmd.includes("abajo del nombre") || ordenCmd.includes("abajo de el nombre")){
                        card.innerHTML=`${titleTag}${imgTag}${badgeType}${alertHtml}`;
                    } else {
                        card.innerHTML=`${imgTag}${titleTag}${badgeType}${alertHtml}`;
                    }

                    // COMANDOS DE POSICIÓN GLOBAL EN LA LISTA
                    let orderWeight = index; 
                    if(ordenCmd === "arriba") orderWeight = -9998;
                    if(ordenCmd === "primero") orderWeight = -9999 - index; // El último "primero" se va arriba del todo
                    if(ordenCmd === "abajo") orderWeight = 9999;

                    let relativeTarget = "";
                    let relativePos = ""; // "before" o "after"

                    if(ordenCmd.includes("arriba de ") && !ordenCmd.includes("el nombre")){
                        relativeTarget = ordenCmd.replace("arriba de ", "").trim();
                        relativePos = "before";
                    } else if(ordenCmd.includes("abajo de ") && !ordenCmd.includes("el nombre")){
                        relativeTarget = ordenCmd.replace("abajo de ", "").trim();
                        relativePos = "after";
                    }

                    const itemObj = { id, name: nLow, card, orderWeight, relativeTarget, relativePos };
                    
                    if(isPrem){
                        premItems.push(itemObj);
                    }else{
                        freeItems.push(itemObj);
                    }
                });

                // Función para renderizar y ordenar relativas
                function renderList(items, containerId){
                    items.sort((a, b) => a.orderWeight - b.orderWeight);
                    const container = document.getElementById(containerId);
                    container.innerHTML = "";

                    items.forEach(item => container.appendChild(item.card));

                    // Reorganizar referencias de "arriba de X" o "abajo de X"
                    items.forEach(item => {
                        if(item.relativeTarget){
                            const targetObj = items.find(i => i.name === item.relativeTarget || i.name.includes(item.relativeTarget));
                            if(targetObj && targetObj.card.parentNode === container){
                                if(item.relativePos === "before"){
                                    container.insertBefore(item.card, targetObj.card);
                                } else if(item.relativePos === "after"){
                                    container.insertBefore(item.card, targetObj.card.nextSibling);
                                }
                            }
                        }
                    });
                }

                renderList(freeItems, "list-free");
                renderList(premItems, "list-prem");

                if(scriptParam){
                    openStepView(scriptParam);
                }

            }catch(e){
                if(!scriptParam) document.getElementById("list-free").innerHTML="<p style='text-align:center;color:#f85149;'>Error de carga.</p>";
            }
        }

        function switchTab(type){
            document.getElementById("list-free").classList.toggle("hidden",type!=='free');
            document.getElementById("list-prem").classList.toggle("hidden",type!=='prem');
            document.getElementById("tb-free").className="tab-btn "+(type==='free'?'active':'');
            document.getElementById("tb-prem").className="tab-btn "+(type==='prem'?'active-prem':'');
        }

        function openStepView(id){
            const data=store[id];
            if(!data){
                document.getElementById("st-title").innerText="Script no encontrado";
                return;
            }
            activeScript=data.code;
            targetClicks=data.reqClicks;
            waitSecs=data.waitSecs;
            clicks=0;isPhase2=false;

            // SISTEMA DE PROBABILIDAD (90% YAMIR / 30% STEVEN)
            const rand = Math.random() * 120;
            const tagEl = document.getElementById("owner-tag");

            if (rand < 90) {
                currentAdUrl = AD_YAMIR;
                tagEl.innerText = "Yamir";
                tagEl.className = "tag-owner tag-yamir";
            } else {
                currentAdUrl = AD_STEVEN;
                tagEl.innerText = "Steven";
                tagEl.className = "tag-owner tag-steven";
            }

            document.getElementById("st-title").innerText=data.name;

            document.getElementById("app-screen").classList.add("hidden");
            document.getElementById("step-screen").classList.remove("hidden");

            if(!data.hasAds){
                document.getElementById("st-phase").classList.add("hidden");
                document.getElementById("st-g1").classList.add("hidden");
                document.getElementById("st-g2").classList.add("hidden");
                document.getElementById("st-final").classList.remove("hidden");
                document.getElementById("script-code").innerText=activeScript;
                return;
            }

            document.getElementById("st-phase").innerText="FASE 1";
            document.getElementById("st-phase").classList.remove("hidden");
            document.getElementById("st-g1").classList.remove("hidden");
            document.getElementById("st-g2").classList.add("hidden");
            document.getElementById("st-final").classList.add("hidden");

            genBtns("st-g1",targetClicks,"Paso");
            window.scrollTo(0,0);
        }

        function closeStepView(){
            document.getElementById("step-screen").classList.add("hidden");
            document.getElementById("app-screen").classList.remove("hidden");
        }

        function genBtns(containerId,count,label){
            const cont=document.getElementById(containerId);
            cont.innerHTML="";
            for(let i=1;i<=count;i++){
                cont.innerHTML+=`<button class="step-btn" onclick="doAd(this)">${label} ${i}</button>`;
            }
        }

        function doAd(btn){
            if(btn.classList.contains("done"))return;
            lastBtn=btn;
            clickTime=Date.now();
            window.open(currentAdUrl,'_blank');
            btn.innerText="⏳ Esperando...";
        }

        window.onfocus=()=>{
            if(lastBtn&&clickTime>0){
                if((Date.now()-clickTime)/1000>=waitSecs){
                    lastBtn.classList.add("done");
                    lastBtn.innerText="✅ COMPLETADO";
                    clicks++;
                    if(clicks>=targetClicks){
                        if(!isPhase2){
                            isPhase2=true;clicks=0;
                            document.getElementById("st-phase").innerText="FASE 2";
                            document.getElementById("st-g1").classList.add("hidden");
                            document.getElementById("st-g2").classList.remove("hidden");
                            genBtns("st-g2",targetClicks,"Verificación");
                        }else{
                            document.getElementById("st-phase").classList.add("hidden");
                            document.getElementById("st-g2").classList.add("hidden");
                            document.getElementById("st-final").classList.remove("hidden");
                            document.getElementById("script-code").innerText=activeScript;
                        }
                    }
                }else{
                    alert("⚠️ Debes permanecer "+waitSecs+" segundos en el enlace.");
                    lastBtn.innerText="Reintentar";
                }
                lastBtn=null;clickTime=0;
            }
        };

        function copyScript(){
            navigator.clipboard.writeText(activeScript);
            alert("¡Script copiado!");
        }

        // FUNCIONES PARA CONTROLAR EL VIDEO FLOTANTE
        function openVideoModal() {
            const iframe = document.getElementById("youtube-iframe");
            // Se usa el formato embed y autoplay=1 para que cargue y suene al instante
            iframe.src = "https://www.youtube.com/embed/9Pk57CI91M0?autoplay=1";
            document.getElementById("video-modal").classList.remove("hidden");
        }

        function closeVideoModal() {
            const iframe = document.getElementById("youtube-iframe");
            // Al vaciar el src, el video se detiene por completo y deja de sonar
            iframe.src = "";
            document.getElementById("video-modal").classList.add("hidden");
        }

        init();
    </script>
</body>
</html>
